name: Road Logistics Space Utilization CI Pipeline

on:
  push:
    branches: [ main, master, dev, feat/* ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-and-optimizer-tests:
    name: Backend Unit, Security, Concurrency & Optimizer Invariant Tests
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Run Master Comprehensive Test Suite
        working-directory: ./backend
        env:
          MONGO_URI: mongodb://127.0.0.1:27017/road_logistics_ci
          JWT_SECRET: ci_secret_key_testing_environment_2026
          TOKEN_SECRET: ci_stop_token_secret_2026
        run: npm test

  frontend-build:
    name: Frontend Production Build & Bundle Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Frontend Client Bundle
        working-directory: ./frontend
        run: npm run build

  analytics-tests:
    name: Python Analytics & Machine Learning Pipeline Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: analytics/requirements.txt

      - name: Install Analytics Dependencies
        working-directory: ./analytics
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run Analytics Pytest Suite
        working-directory: ./analytics
        run: pytest
